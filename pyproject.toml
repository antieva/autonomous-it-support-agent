[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-it-support-agent"
version = "0.1.0"
description = "A Level 1 IT incident responder with OpenAI-compatible tool calling"
requires-python = ">=3.9"
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
it-support-agent = "it_support_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

